[package]
name = "verify-mldsa-host"
version = "0.1.0"
edition = "2021"
# Há vários binários em src/bin/ além de src/main.rs. Isso fixa qual roda
# com `cargo run` sem --bin, mantendo o comando do M1 no README.
default-run = "verify-mldsa-host"

[dependencies]
# native-gnark: compila o wrapper Groth16 (gnark) via Go local em vez de
# depender da imagem Docker oficial do SP1, que só tem build para amd64
# (falha em Apple Silicon).
sp1-sdk = { version = "6", features = ["blocking", "native-gnark"] }
# defaults do fips204 (default-rng + todas as variantes) ficam ligados aqui:
# o host roda nativamente e precisa gerar chaves/assinar para montar os casos de teste.
fips204 = "0.4.6"
# mesma versão usada internamente por sp1-sdk para (de)serializar SP1ProofWithPublicValues
bincode = "1.3"
# encoding hex das fixtures Groth16 consumidas pelo teste de gas em Solidity (M5)
hex = "0.4"

[build-dependencies]
sp1-build = "6"

[[test]]
name = "verify_mldsa"
path = "tests/verify_mldsa.rs"
harness = true
